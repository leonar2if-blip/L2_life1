const notesV=()=>{const tags=[...new Set(N.filter(n=>!n.ar).flatMap(n=>n.tags))],ar=N.filter(n=>n.ar).length;return hd('Notas',`${N.filter(n=>!n.ar).length} notas`)+`<input id="f-q" class="si" value="${esc(nq)}" placeholder="Buscar en notas, etiquetas y listas" autocomplete="off">`+(tags.length?`<div class="chips" style="margin:12px 0 4px">${tags.map(t=>`<button data-tag="${esc(t)}"${t==ntag?' class="on"':''}>#${esc(t)}</button>`).join('')}</div>`:'')+`<div id="nl">${nList()}</div>`+(ar?`<button class="lk" data-a="na">Archivadas (${ar})</button>`:'')};
const nDet=()=>{const n=N[V.i];return `<div class="hd"><button class="ib bk" aria-label="Volver">${ic('back')}</button><span class="tb"><button class="ib" data-pin="1" aria-label="Fijar">${ic('pin')}</button><button class="ib" data-narc="1" aria-label="Archivar">${ic('arch')}</button><button class="ib dn" aria-label="Eliminar">${ic('trash')}</button></span></div><input class="ti" id="f-nt" value="${esc(n.t)}" placeholder="Título">${seg('list',[0,1],['Nota','Lista'],n.list)}${n.list?n.items.map((x,k)=>`<div class="ni${x.d?' done':''}" data-k="${k}"><span class="ck">${ic('tasks',2.6)}</span><div class="g t">${esc(x.t)}</div><button class="sx" data-nx="${k}">×</button></div>`).join('')+'<input id="f-ni" class="si" placeholder="Añadir elemento y pulsar Enter" autocomplete="off">':`<textarea id="f-nb" class="nb" placeholder="Escribe aquí…" style="margin-top:14px">${esc(n.b)}</textarea>`}<div class="fl">Etiquetas</div><div class="chips">${n.tags.map((t,k)=>`<button data-tx="${k}">#${esc(t)} ×</button>`).join('')}</div><input id="f-tg" class="si" placeholder="Nueva etiqueta y Enter" autocomplete="off"><div class="fl">Enlace</div><input id="f-nl" class="si" value="${esc(n.link)}" placeholder="https://…">${n.link?`<a class="lk att" href="${esc(n.link)}" target="_blank" rel="noopener">Abrir enlace</a>`:''}<div class="fl">Adjuntos</div><div class="chips">${n.att.map((a,k)=>`<button data-ax="${k}">${esc(a)} ×</button>`).join('')}</div><label class="lk att">+ Adjuntar archivo<input type="file" id="f-na" hidden></label>`};
const nArch=()=>hd('Notas archivadas','Se conservan fuera de tu lista',0)+(N.filter(n=>n.ar).map(n=>`<div class="row"><div class="g"><div class="t">${esc(n.t||'Sin título')}</div><div class="sm">${ago(n.u)}</div></div><button class="pill sm2" data-nres="${N.indexOf(n)}">Restaurar</button></div>`).join('')||'<p class="sb">No hay notas archivadas.</p>');
const homeX=()=>{const nw=new Date(),now=nw.getHours()*60+nw.getMinutes(),nx=items(D0).filter(x=>x.k=='e'&&x.time&&mins(x.time)>=now).sort((a,b)=>mins(a.time)-mins(b.time))[0];$('#cb').textContent=nx?nx.time:'—';$('#cs').textContent=nx?nx.o.t+(nx.o.loc?' · '+nx.o.loc:''):'Nada más hoy';const nn=N.filter(n=>!n.ar).sort((a,b)=>b.pin-a.pin||b.u-a.u)[0];$('#nb').textContent=nn?nn.t:'Sin notas';$('#ns').textContent=nn?ago(nn.u):''};
function act2(e){const q=s=>e.target.closest(s);
 const cv=q('[data-cv]');if(cv){cvw=+cv.dataset.cv;redraw();return true}
 const cn=q('[data-cn]');if(cn){go(+cn.dataset.cn);redraw();return true}
 const dt=q('[data-dt]');if(dt){cs=new Date(+dt.dataset.dt);cc=new Date(cs.getFullYear(),cs.getMonth(),1);if(!q('.cg')&&cvw!=0)cvw=2;redraw();return true}
 const ev=q('.ev');if(ev){V={k:'cal',sub:'ed',i:+ev.dataset.e};redraw();mod.scrollTop=0;return true}
 if(q('.pl2')&&V.k=='cal'&&!V.sub){E.push(mkE('',{d0:new Date(cs),time:'09:00',end:'10:00'}));V={k:'cal',sub:'ed',i:E.length-1};redraw();mod.scrollTop=0;setTimeout(()=>$('#f-et').focus(),50);return true}
 const al=q('[data-all]');if(al){E[V.i].all=!E[V.i].all;redraw();return true}
 if(q('.de')){const i=V.i,x=E.splice(i,1)[0];V.sub=null;redraw();toast('Evento eliminado',()=>{E.splice(i,0,x);redraw()});return true}
 const nr=q('.nr');if(nr){V={k:'notes',sub:'nd',i:+nr.dataset.n};redraw();mod.scrollTop=0;return true}
 if(q('.pl2')&&V.k=='notes'&&!V.sub){N.unshift(mkN('',''));V={k:'notes',sub:'nd',i:0};redraw();setTimeout(()=>$('#f-nt').focus(),50);return true}
 const tg=q('[data-tag]');if(tg){ntag=ntag==tg.dataset.tag?'':tg.dataset.tag;redraw();return true}
 const ni=q('.ni .ck');if(ni){const x=N[V.i].items[+ni.closest('.ni').dataset.k];x.d=x.d?0:1;redraw();return true}
 const nx=q('[data-nx]');if(nx){N[V.i].items.splice(+nx.dataset.nx,1);redraw();return true}
 const tx=q('[data-tx]');if(tx){N[V.i].tags.splice(+tx.dataset.tx,1);redraw();return true}
 const ax=q('[data-ax]');if(ax){N[V.i].att.splice(+ax.dataset.ax,1);redraw();return true}
 if(q('[data-pin]')){N[V.i].pin=N[V.i].pin?0:1;redraw();toast(N[V.i].pin?'Nota fijada':'Nota desfijada');return true}
 if(q('[data-narc]')){const x=N[V.i];x.ar=1;V.sub=null;redraw();toast('Nota archivada',()=>{x.ar=0;redraw()});return true}
 if(q('.dn')){const i=V.i,x=N.splice(i,1)[0];V.sub=null;redraw();toast('Nota eliminada',()=>{N.splice(i,0,x);redraw()});return true}
 if(q('[data-a=na]')){V.sub='na';redraw();return true}
 const nrs=q('[data-nres]');if(nrs){N[+nrs.dataset.nres].ar=0;redraw();toast('Nota restaurada');return true}
 return false}
mod.addEventListener('keydown',e=>{if(e.key!='Enter')return;const i=e.target.id,v=(e.target.value||'').trim();if(!v)return;if(i=='f-ni'){N[V.i].items.push({t:v,d:0});redraw();setTimeout(()=>$('#f-ni').focus(),30)}else if(i=='f-tg'){const t=v.replace(/^#/,'');if(!N[V.i].tags.includes(t))N[V.i].tags.push(t);redraw();setTimeout(()=>$('#f-tg').focus(),30)}});
mod.addEventListener('change',e=>{if(e.target.id=='f-na'&&e.target.files[0]){N[V.i].att.push(e.target.files[0].name);redraw()}});
let gx=0,gy=0,gok=0;mod.addEventListener('pointerdown',e=>{gok=!!e.target.closest('.cg');gx=e.clientX;gy=e.clientY});
mod.addEventListener('pointerup',e=>{if(!gok)return;gok=0;const dx=e.clientX-gx;if(Math.abs(dx)>60&&Math.abs(e.clientY-gy)<50){swd=Date.now();go(dx<0?1:-1);redraw()}});
sync();
</script>
</body></html>
